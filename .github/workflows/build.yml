name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  asset: usbscan-linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, asset: usbscan-linux-aarch64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     asset: usbscan-windows-x86_64.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,       asset: usbscan-macos-aarch64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,        asset: usbscan-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        run: cargo install cross --locked
      - if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          mkdir dist
          src=target/${{ matrix.target }}/release/usbscan
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
